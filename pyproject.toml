[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "deep-learning-critical-systems"
version = "1.0.0"
description = "Reproduzierbarer PyTorch-Forschungsprototyp zur Vorhersage finanzieller Stressregime."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Maik Hübner" }
]
keywords = [
    "deep-learning",
    "pytorch",
    "finance",
    "time-series",
    "transformer",
    "explainable-ai"
]
dependencies = [
    "torch==2.13.0",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "matplotlib==3.11.1",
    "certifi==2026.07.22",
]


[project.optional-dependencies]
dev = [
    "pytest==8.4.2"
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
