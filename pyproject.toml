[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "deep-learning-critical-systems"
version = "1.0.1"
description = "Reproduzierbarer PyTorch-Forschungsprototyp zur Vorhersage finanzieller Stressregime."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [
    { name = "Maik Hübner" }
]
keywords = [
    "deep-learning",
    "pytorch",
    "finance",
    "time-series",
    "transformer",
    "explainable-ai"
]
dependencies = [
    "torch==2.13.0",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "matplotlib==3.11.1",
    "certifi==2026.07.22",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/Maik-Huebner/deep-learning-critical-systems"
Issues = "https://github.com/Maik-Huebner/deep-learning-critical-systems/issues"


[project.optional-dependencies]
dev = [
    "build==1.3.0",
    "pytest==8.4.2",
    "ruff==0.12.0",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
docstring-code-format = true
