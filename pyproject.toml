[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-learning-critical-systems"
version = "0.1.0"
description = "Production-oriented PyTorch project for risk-sensitive financial AI systems."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Maik Hübner" }
]
keywords = [
    "deep-learning",
    "pytorch",
    "finance",
    "time-series",
    "explainable-ai"
]
dependencies = [
    "torch==2.13.0",
    "torchvision==0.28.0",
    "numpy==2.5.1",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
